name: dmas-long-context-memory
services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      # Langfuse callback — every completion routed through this litellm
      # is traced (prompt + completion + usage). Keys must match the
      # langfuse-web LANGFUSE_INIT_PROJECT_* below.
      - LANGFUSE_HOST=http://langfuse-web:3000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    networks:
      - dmas-network
    restart: unless-stopped
    labels:
      - "group=cloud"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # Self-hosted Langfuse v2 (single web container + postgres). Used to
  # inspect every prompt LiteLLM routes — see localhost:3000 after
  # `make start`. Login: dev@local / devdevdev. Project keys are
  # auto-bootstrapped on the postgres first-boot via LANGFUSE_INIT_*
  # so they match the values litellm sends. v2 is chosen over v3
  # because it doesn't require clickhouse/redis/minio.
  langfuse-db:
    image: postgres:15
    container_name: langfuse-db
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=langfuse
      - POSTGRES_DB=langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    networks:
      - dmas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 3s
      retries: 20
    labels:
      - "group=cloud"

  langfuse-web:
    # Pinned to a v2 tag known to accept LANGFUSE_INIT_* bootstrap.
    image: langfuse/langfuse:2.93.7
    container_name: langfuse-web
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      # Bound to all interfaces so it's reachable on the EC2 public IP.
      # The EC2 security group still has to allow inbound 3000.
      # `LANGFUSE_PUBLIC_URL` overrides the host portion when set; keep it
      # in sync with what the operator types in the browser, otherwise
      # NextAuth cookies won't bind to the right origin and login fails.
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      - NEXTAUTH_URL=${LANGFUSE_PUBLIC_URL:-http://localhost:3000}
      # Auto-generated by `make _bootstrap_env_file` — do not commit real
      # values. Override per-deployment via .env if needed.
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:?set LANGFUSE_NEXTAUTH_SECRET in .env}
      - SALT=${LANGFUSE_SALT:?set LANGFUSE_SALT in .env}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY in .env (64 hex chars)}
      - TELEMETRY_ENABLED=false
      # First-boot bootstrap: only fires when the postgres data dir is empty.
      # After that, manage user/projects/keys through the UI.
      - LANGFUSE_INIT_ORG_ID=dmas
      - LANGFUSE_INIT_ORG_NAME=dmas
      - LANGFUSE_INIT_PROJECT_ID=dmas-local
      - LANGFUSE_INIT_PROJECT_NAME=dmas-local
      - LANGFUSE_INIT_USER_EMAIL=dev@local.dev
      - LANGFUSE_INIT_USER_NAME=dev
      - LANGFUSE_INIT_USER_PASSWORD=devdevdev
    networks:
      - dmas-network
    restart: unless-stopped
    labels:
      - "group=cloud"

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:latest
    container_name: toxiproxy
    networks:
      - dmas-network
    ports:
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:8005:18005" # listen to Memory
      - "127.0.0.1:8006:18006" # listen to Responder
    command: ["-host=0.0.0.0"]
    restart: unless-stopped
    labels:
      - "group=cloud"

  benchmark:
    build:
      context: ./benchmark
      dockerfile: Dockerfile
    container_name: benchmark
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      - DATA_URL=https://raw.githubusercontent.com/snap-research/locomo/refs/heads/main/data/locomo10.json
      - LITELLM_METRICS_URL=http://litellm:4000/metrics
      - DOCKER_SOCKET=/var/run/docker.sock
      - CGROUP_ROOT=/host-cgroup
      - PROC_ROOT=/host-proc
      - TOXIPROXY_ADMINS=http://toxiproxy:8474
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - RESULTS_DIR=/results
    volumes:
      - ../experiments/results:/results
      - /sys/fs/cgroup:/host-cgroup:ro
      - /proc:/host-proc:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dmas-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    restart: unless-stopped
    labels:
      - "group=cloud"
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - memory-internal
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    restart: unless-stopped
    labels:
      - "group=cloud"
  neo4j:
    image: neo4j:5.26
    container_name: neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_max__size=512M
      - NEO4J_dbms_memory_pagecache_size=256M
      # Force a checkpoint after every committed transaction (default
      # 100k) so the async checkpointer flushes the page cache into the
      # bench's per-call snapshot window. The bench then waits for disk
      # I/O to quiesce before reading t1, so disk_cloud_bytes attributes
      # graphiti's writes to the row that caused them.
      - NEO4J_db_checkpoint_interval_tx=1
      - NEO4J_db_checkpoint_interval_time=1s
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - memory-internal
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    restart: unless-stopped
    labels:
      - "group=cloud"
  memory:
    build:
      context: ./memory
      dockerfile: Dockerfile
    container_name: memory
    # Port exposed only via toxiproxy (host 8005 -> toxiproxy 18005 -> memory 8002)
    depends_on:
      - qdrant
      - neo4j
    environment:
      - OPENAI_API_KEY=${LITELLM_OPENAI_API_KEY:-sk-litellm-master}
      - OPENAI_BASE_URL=${LITELLM_OPENAI_BASE_URL:-http://litellm:4000/v1}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - GRAPHITI_TELEMETRY_ENABLED=${GRAPHITI_TELEMETRY_ENABLED:-false}
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - MEMORIES_SEARCH_LIMIT=${MEMORIES_SEARCH_LIMIT:-20}
      - RAG_CHUNK_TURNS=${RAG_CHUNK_TURNS:-5}
      - RAG_EMBED_MODEL=${RAG_EMBED_MODEL:-text-embedding-3-small}
      - RAG_EMBED_DIM=${RAG_EMBED_DIM:-1536}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - LANGFUSE_SERVICE_TAG=memory
    networks:
      - memory-internal
      - dmas-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    restart: unless-stopped
    labels:
      - "group=cloud"
  responder:
    build:
      context: ./responder
      dockerfile: Dockerfile
    container_name: responder
    # Port exposed only via toxiproxy (host 8006 -> toxiproxy 18006 -> responder 8003)
    environment:
      - OPENAI_API_KEY=${LITELLM_OPENAI_API_KEY:-sk-litellm-master}
      - MODEL=${MODEL:-gpt-4o-mini}
      - OPENAI_BASE_URL=${LITELLM_OPENAI_BASE_URL:-http://litellm:4000/v1}
      - MEMORY_URL=${MEMORY_URL:-http://toxiproxy:18005}
      - LANGFUSE_SERVICE_TAG=responder
    networks:
      - dmas-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    restart: unless-stopped
    labels:
      - "group=cloud"
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "127.0.0.1:11435:11434" # Changed to 11435 to avoid conflict with host ollama
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        ollama serve &
        OLLAMA_PID=$$!

        echo "Waiting for Ollama server to start..."
        sleep 10
        until ollama list > /dev/null 2>&1; do
          echo "Still waiting for Ollama..."
          sleep 2
        done

        echo "Ollama server is ready, pulling model..."
        ollama pull ${OLLAMA_MODEL}

        echo "Model pulled successfully"
        wait $$OLLAMA_PID
    networks:
      - dmas-network
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL}
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q '${OLLAMA_MODEL}'"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 6G
    restart: unless-stopped
    labels:
      - "group=edge"
  coordinator:
    build:
      context: ./coordinator
      dockerfile: Dockerfile
    container_name: coordinator
    ports:
      - "127.0.0.1:8003:8001"
    depends_on:
      benchmark:
        condition: service_started
      memory:
        condition: service_started
      responder:
        condition: service_started
      ollama:
        condition: service_healthy
      toxiproxy:
        condition: service_started
    environment:
      - MEMORY_URL=${MEMORY_URL:-http://toxiproxy:18005}
      - RESPONDER_URL=${RESPONDER_URL:-http://toxiproxy:18006}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://litellm:4000/v1}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - OPENAI_API_KEY=${LITELLM_OPENAI_API_KEY:-sk-litellm-master}
      - LANGFUSE_SERVICE_TAG=coordinator
    networks:
      - dmas-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    restart: unless-stopped
    labels:
      - "group=edge"
volumes:
  qdrant-data:
    labels:
      group: cloud
  neo4j-data:
    labels:
      group: cloud
  neo4j-logs:
    labels:
      group: cloud
  ollama_data:
    labels:
      group: edge
  langfuse-db-data:
    labels:
      group: cloud
networks:
  dmas-network:
    external: true
  memory-internal:
    driver: bridge
