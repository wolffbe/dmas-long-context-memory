name: dmas-long-context-memory
services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:latest
    container_name: toxiproxy
    networks:
      - dmas-network
    ports:
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:8005:18005" # listen to Memory
      - "127.0.0.1:8006:18006" # listen to Responder
      - "127.0.0.1:8007:18007" # Listen to Locomo
    command: ["-host=0.0.0.0"]
    restart: unless-stopped
    labels:
      - "group=cloud"

  locomo:
    build:
      context: ./locomo
      dockerfile: Dockerfile
    container_name: locomo
    # Port exposed only via toxiproxy (host 8004 -> toxiproxy 18004 -> locomo 8000)
    environment:
      - DATA_URL=https://raw.githubusercontent.com/snap-research/locomo/refs/heads/main/data/locomo10.json
    networks:
      - dmas-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - memory-internal
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    restart: unless-stopped
    labels:
      - "group=cloud"
  neo4j:
    image: neo4j:5.26
    container_name: neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_max__size=512M
      - NEO4J_dbms_memory_pagecache_size=256M
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - memory-internal
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    restart: unless-stopped
    labels:
      - "group=cloud"
  memory:
    build:
      context: ./memory
      dockerfile: Dockerfile
    container_name: memory
    # Port exposed only via toxiproxy (host 8005 -> toxiproxy 18005 -> memory 8002)
    depends_on:
      - qdrant
      - neo4j
    environment:
      - MEMORY_BACKEND=${MEMORY_BACKEND}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - GRAPHITI_TELEMETRY_ENABLED=false
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    networks:
      - memory-internal
      - dmas-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    restart: unless-stopped
    labels:
      - "group=cloud"
  responder:
    build:
      context: ./responder
      dockerfile: Dockerfile
    container_name: responder
    # Port exposed only via toxiproxy (host 8006 -> toxiproxy 18006 -> responder 8003)
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MODEL=${MODEL:-gpt-4o}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
    networks:
      - dmas-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    restart: unless-stopped
    labels:
      - "group=cloud"
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "127.0.0.1:11435:11434" # Changed to 11435 to avoid conflict with host ollama
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        ollama serve &
        OLLAMA_PID=$$!

        echo "Waiting for Ollama server to start..."
        sleep 10
        until ollama list > /dev/null 2>&1; do
          echo "Still waiting for Ollama..."
          sleep 2
        done

        echo "Ollama server is ready, pulling models..."
        for MODEL in ${OLLAMA_MODELS}; do
          if ollama list | grep -q "$$MODEL"; then
            echo "Model $$MODEL already present, skipping pull."
          else
            echo "Pulling $$MODEL..."
            ollama pull $$MODEL
          fi
        done

        echo "All models ready."
        wait $$OLLAMA_PID
    networks:
      - dmas-network
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - OLLAMA_MODELS=${OLLAMA_MODELS}
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q '${OLLAMA_MODEL}'"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    labels:
      - "group=edge"
  coordinator:
    build:
      context: ./coordinator
      dockerfile: Dockerfile
    container_name: coordinator
    ports:
      - "127.0.0.1:8003:8001"
    depends_on:
      locomo:
        condition: service_started
      memory:
        condition: service_started
      responder:
        condition: service_started
      ollama:
        condition: service_healthy
      toxiproxy:
        condition: service_started
    environment:
      - LOCOMO_URL=http://toxiproxy:18007
      - MEMORY_URL=http://toxiproxy:18005
      - RESPONDER_URL=http://toxiproxy:18006
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
    networks:
      - dmas-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    restart: unless-stopped
    labels:
      - "group=edge"
volumes:
  qdrant-data:
    labels:
      group: cloud
  neo4j-data:
    labels:
      group: cloud
  neo4j-logs:
    labels:
      group: cloud
  ollama_data:
    labels:
      group: edge
networks:
  dmas-network:
    external: true
  memory-internal:
    driver: bridge
