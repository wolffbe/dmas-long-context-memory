name: dmas

x-agent-base: &agent-base
  image: dmas/agent:latest
  restart: unless-stopped

services:
  # ---------------- shared infra ----------------
  qdrant-1:
    image: qdrant/qdrant:v1.12.4
    container_name: dmas-qdrant-1
    restart: unless-stopped
    networks: [agent1-net, shared-net]
    volumes: [qdrant-data-1:/qdrant/storage]
    labels:
      group: edge

  qdrant-2:
    image: qdrant/qdrant:v1.12.4
    container_name: dmas-qdrant-2
    restart: unless-stopped
    networks: [agent2-net, shared-net]
    volumes: [qdrant-data-2:/qdrant/storage]
    labels:
      group: cloud

  qdrant-3:
    image: qdrant/qdrant:v1.12.4
    container_name: dmas-qdrant-3
    restart: unless-stopped
    networks: [agent3-net, shared-net]
    volumes: [qdrant-data-3:/qdrant/storage]
    labels:
      group: cloud

  neo4j-1:
    image: neo4j:5.26
    container_name: dmas-neo4j-1
    restart: unless-stopped
    networks: [agent1-net, shared-net]
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - neo4j-data-1:/data
      - neo4j-logs-1:/logs
    labels:
      group: edge

  neo4j-2:
    image: neo4j:5.26
    container_name: dmas-neo4j-2
    restart: unless-stopped
    networks: [agent2-net, shared-net]
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - neo4j-data-2:/data
      - neo4j-logs-2:/logs
    labels:
      group: cloud

  neo4j-3:
    image: neo4j:5.26
    container_name: dmas-neo4j-3
    restart: unless-stopped
    networks: [agent3-net, shared-net]
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - neo4j-data-3:/data
      - neo4j-logs-3:/logs
    labels:
      group: cloud

  ollama:
    image: ollama/ollama:latest
    container_name: dmas-ollama
    restart: unless-stopped
    networks: [shared-net]
    volumes: [ollama-data:/root/.ollama]
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_NUM_THREADS: "16"
    deploy:
      resources:
        reservations:
          memory: 6G
        limits:
          memory: 12G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    labels:
      group: edge

  ollama-pull:
    image: ollama/ollama:latest
    container_name: dmas-ollama-pull
    networks: [shared-net]
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh","-c"]
    command: ["echo '==> ollama pull gemma4:e4b' && ollama pull gemma4:e4b"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: "no"

  # ---------------- langfuse self-hosted ----------------
  langfuse-postgres:
    image: postgres:16-alpine
    container_name: dmas-langfuse-postgres
    restart: unless-stopped
    networks: [shared-net]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langfuse
    volumes: [langfuse-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d langfuse"]
      interval: 5s
      timeout: 3s
      retries: 30
    labels:
      group: observability

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: dmas-langfuse-clickhouse
    restart: unless-stopped
    networks: [shared-net]
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    command: ["--max_server_memory_usage_to_ram_ratio=0.3"]
    volumes: [langfuse-clickhouse:/var/lib/clickhouse]
    labels:
      group: observability

  langfuse-web:
    image: langfuse/langfuse:2
    container_name: dmas-langfuse-web
    restart: unless-stopped
    networks: [shared-net]
    depends_on:
      langfuse-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@langfuse-postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-changeme-please}
      SALT: ${LANGFUSE_SALT:-changeme-please}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: dmas
      LANGFUSE_INIT_PROJECT_ID: dmas
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
    ports:
      - "127.0.0.1:3001:3000"
    labels:
      group: observability

  # ---------------- per-agent stacks ----------------

  toxiproxy-1:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: dmas-toxiproxy-1
    restart: unless-stopped
    networks: [agent1-net, shared-net]
    command: ["-host", "0.0.0.0", "-config", "/config.json", "-proxy-metrics", "-runtime-metrics"]
    volumes: [./toxiproxy/agent-1.json:/config.json:ro]
    ports:
      - "127.0.0.1:8475:8474"
    labels:
      group: edge

  litellm-1:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: dmas-litellm-1
    restart: unless-stopped
    networks: [agent1-net, shared-net]
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
      langfuse-web:
        condition: service_started
    volumes: [./litellm/agent-1.yaml:/app/config.yaml:ro]
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: http://langfuse-web:3000
      LANGFUSE_DEFAULT_TAGS: '["agent-1","litellm"]'
    labels:
      group: edge

  agent-1:
    <<: *agent-base
    build:
      context: ./agent
    container_name: dmas-agent-1
    networks: [agent1-net, shared-net]
    depends_on:
      qdrant-1:
        condition: service_started
      neo4j-1:
        condition: service_healthy
      litellm-1:
        condition: service_started
    environment:
      AGENT_ID: "1"
      LITELLM_URL: http://litellm-1:4000/v1
      PEERS: http://toxiproxy-1:18002,http://toxiproxy-1:18003
      TOXIPROXY_ADMIN: http://toxiproxy-1:8474
      JITTER_PROXY_NAME: peers
      QDRANT_URL: http://qdrant-1:6333
      NEO4J_URI: bolt://neo4j-1:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      LANGFUSE_HOST: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      MAX_CONTEXT_MEMORIES: ${MAX_CONTEXT_MEMORIES:-40}
      SEARCH_LIMIT: ${SEARCH_LIMIT:-200}
      MEM0_COLLECTION: mem0_agent1
      RAG_COLLECTION: rag_agent1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:8011:8000"
    labels:
      group: edge

  coordinator:
    build: ./coordinator
    image: dmas/coordinator:latest
    container_name: dmas-coordinator
    restart: unless-stopped
    networks: [shared-net]
    depends_on:
      agent-1:
        condition: service_started
      agent-2:
        condition: service_started
      agent-3:
        condition: service_started
      toxiproxy-1:
        condition: service_started
      toxiproxy-2:
        condition: service_started
      toxiproxy-3:
        condition: service_started
    environment:
      AGENT_UPSTREAM: http://agent-1:8000
      UPSTREAM_AGENT_ID: "1"
      AGENT_URLS: http://agent-1:8000,http://agent-2:8000,http://agent-3:8000
      TOXIPROXY_ADMINS: http://toxiproxy-1:8474,http://toxiproxy-2:8474,http://toxiproxy-3:8474
      PROMETHEUS_URL: http://prometheus:9090
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JUDGE_MODEL_ZEP: ${JUDGE_MODEL_ZEP:-gpt-5-mini}
    volumes:
      - coordinator-data:/data
    ports:
      - "8810:8000"
    labels:
      group: edge

  # NOTE: peer-heartbeat is now run BY each agent (dmas/agent/app/heartbeat.py)
  # so the peer_request_duration_seconds histogram (driving the Grafana
  # dashboard) gets populated alongside toxiproxy bytes — no separate sidecar.

  toxiproxy-2:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: dmas-toxiproxy-2
    restart: unless-stopped
    networks: [agent2-net, shared-net]
    command: ["-host", "0.0.0.0", "-config", "/config.json", "-proxy-metrics", "-runtime-metrics"]
    volumes: [./toxiproxy/agent-2.json:/config.json:ro]
    ports:
      - "127.0.0.1:8476:8474"
    labels:
      group: cloud

  litellm-2:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: dmas-litellm-2
    restart: unless-stopped
    networks: [agent2-net, shared-net]
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
      langfuse-web:
        condition: service_started
    volumes: [./litellm/agent-2.yaml:/app/config.yaml:ro]
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: http://langfuse-web:3000
      LANGFUSE_DEFAULT_TAGS: '["agent-2","litellm"]'
    labels:
      group: cloud

  agent-2:
    <<: *agent-base
    container_name: dmas-agent-2
    networks: [agent2-net, shared-net]
    depends_on:
      qdrant-2:
        condition: service_started
      neo4j-2:
        condition: service_healthy
      litellm-2:
        condition: service_started
    environment:
      AGENT_ID: "2"
      LITELLM_URL: http://litellm-2:4000/v1
      PEERS: http://toxiproxy-2:18001,http://toxiproxy-2:18003
      TOXIPROXY_ADMIN: http://toxiproxy-2:8474
      JITTER_PROXY_NAME: peers
      QDRANT_URL: http://qdrant-2:6333
      NEO4J_URI: bolt://neo4j-2:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      LANGFUSE_HOST: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      MAX_CONTEXT_MEMORIES: ${MAX_CONTEXT_MEMORIES:-40}
      SEARCH_LIMIT: ${SEARCH_LIMIT:-200}
      MEM0_COLLECTION: mem0_agent2
      RAG_COLLECTION: rag_agent2
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:8012:8000"
    labels:
      group: cloud

  toxiproxy-3:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: dmas-toxiproxy-3
    restart: unless-stopped
    networks: [agent3-net, shared-net]
    command: ["-host", "0.0.0.0", "-config", "/config.json", "-proxy-metrics", "-runtime-metrics"]
    volumes: [./toxiproxy/agent-3.json:/config.json:ro]
    ports:
      - "127.0.0.1:8477:8474"
    labels:
      group: cloud

  litellm-3:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: dmas-litellm-3
    restart: unless-stopped
    networks: [agent3-net, shared-net]
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
      langfuse-web:
        condition: service_started
    volumes: [./litellm/agent-3.yaml:/app/config.yaml:ro]
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: http://langfuse-web:3000
      LANGFUSE_DEFAULT_TAGS: '["agent-3","litellm"]'
    labels:
      group: cloud

  agent-3:
    <<: *agent-base
    container_name: dmas-agent-3
    networks: [agent3-net, shared-net]
    depends_on:
      qdrant-3:
        condition: service_started
      neo4j-3:
        condition: service_healthy
      litellm-3:
        condition: service_started
    environment:
      AGENT_ID: "3"
      LITELLM_URL: http://litellm-3:4000/v1
      PEERS: http://toxiproxy-3:18001,http://toxiproxy-3:18002
      TOXIPROXY_ADMIN: http://toxiproxy-3:8474
      JITTER_PROXY_NAME: peers
      QDRANT_URL: http://qdrant-3:6333
      NEO4J_URI: bolt://neo4j-3:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      LANGFUSE_HOST: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      MAX_CONTEXT_MEMORIES: ${MAX_CONTEXT_MEMORIES:-40}
      SEARCH_LIMIT: ${SEARCH_LIMIT:-200}
      MEM0_COLLECTION: mem0_agent3
      RAG_COLLECTION: rag_agent3
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:8013:8000"
    labels:
      group: cloud

networks:
  shared-net:
    driver: bridge
  agent1-net:
    driver: bridge
  agent2-net:
    driver: bridge
  agent3-net:
    driver: bridge

volumes:
  qdrant-data-1:
  qdrant-data-2:
  qdrant-data-3:
  neo4j-data-1:
  neo4j-data-2:
  neo4j-data-3:
  neo4j-logs-1:
  neo4j-logs-2:
  neo4j-logs-3:
  ollama-data:
  coordinator-data:
  langfuse-postgres:
  langfuse-clickhouse:
