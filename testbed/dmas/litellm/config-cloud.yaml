model_list:
  # Single deployment per model. The responder catches 429s and waits
  # using OpenAI's x-ratelimit-reset-* headers, so litellm does NOT need
  # a backup-key pool — failing over to a smaller-tier backup turned
  # out to be worse than letting OpenAI's own rate-limit window expire.
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  drop_params: true
  # The "prometheus" callback is what makes litellm expose its
  # /metrics endpoint with the litellm_total_tokens_metric_total +
  # litellm_spend_metric_total counters. The bench reads /metrics
  # directly (no Prometheus server), but this callback is still
  # required to populate those counters. Don't remove.
  # `otel` exports each completion as a `gen_ai.*` span via OTLP to
  # langfuse-web v3 — endpoint + Basic-auth header come from
  # OTEL_EXPORTER_OTLP_* env in docker-compose.yml. With W3C
  # `traceparent` propagated by the OpenAI SDK's HTTP client, each
  # gen_ai span nests under the caller's manual span (e.g.
  # `memory.persist`) instead of forming a standalone trace.
  success_callback: ["otel", "prometheus"]
  failure_callback: ["otel", "prometheus"]
  redact_user_api_key_info: true
  # num_retries: 0 — let the responder handle 429s directly. It reads
  # OpenAI's x-ratelimit-reset-{requests,tokens} headers and sleeps the
  # exact window, then retries. This lets the benchmark report retry
  # wait time as a separate column (cloud_llm_retry_wait_ms) so the
  # latency analysis can subtract throttle waits from compute time.
  num_retries: 0
  request_timeout: 120

router_settings:
  cooldown_time: 0

general_settings:
  master_key: sk-litellm-master
