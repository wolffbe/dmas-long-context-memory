name: dmas-long-context-memory
services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.83.14-stable.patch.3
    container_name: litellm
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      # Mounted as a template; entrypoint sed-substitutes @OLLAMA_MODEL@
      # into a runtime copy at /tmp/config.yaml before exec'ing litellm.
      - ./litellm/config.yaml:/app/config.yaml.tpl:ro
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Defaults to the primary so the backup deployment in litellm/config.yaml
      # is always reachable; setting a real second key activates ping-pong.
      - OPENAI_API_KEY_BACKUP=${OPENAI_API_KEY_BACKUP:-${OPENAI_API_KEY}}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      # OTel callback — each completion is exported as a `gen_ai.*` span
      # via OTLP/HTTP to langfuse-web v3. Replaces the v2 Langfuse SDK
      # callback so generations nest under the caller's manual span
      # (e.g. `memory.persist`) via W3C traceparent propagation.
      - LANGFUSE_HOST=http://langfuse-web:3000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://langfuse-web:3000/api/public/otel
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=litellm
      # Tell litellm proxy's OTel callback (traceloop-based) to include
      # prompt + completion text in the `gen_ai`/`raw_gen_ai_request`
      # spans. Off by default to avoid leaking PII; without it, langfuse
      # generations show usage/cost but the input/output panels stay
      # empty. `OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT` is
      # for the upstream OpenAI instrumentation; litellm proxy ignores
      # it and uses TRACELOOP_TRACE_CONTENT instead.
      - TRACELOOP_TRACE_CONTENT=true
      # Authorization header is base64(public:secret); operator should
      # set LANGFUSE_OTEL_BASIC_AUTH in .env (or a make target generates
      # it). The `:-` fallback keeps the env defined when keys are absent
      # so the container still boots.
      - OTEL_EXPORTER_OTLP_HEADERS=Authorization=Basic ${LANGFUSE_OTEL_BASIC_AUTH:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        : "$${OLLAMA_MODEL:?OLLAMA_MODEL must be set}"
        sed "s|@OLLAMA_MODEL@|$$OLLAMA_MODEL|g" /app/config.yaml.tpl > /tmp/config.yaml
        exec litellm --config /tmp/config.yaml --port 4000 --host 0.0.0.0
    networks:
      - dmas-network
    restart: unless-stopped
    # Unlabelled: gateway in front of the SUT, serves both edge and
    # cloud models. Tokens/cost are recovered from /metrics by model.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # Self-hosted Langfuse v3 (web + worker + postgres + clickhouse + redis +
  # minio). v3 was chosen over v2 to enable OTLP ingest at
  # /api/public/otel/v1/traces — every service emits OTel spans (FastAPI
  # inbound, httpx/requests outbound, manual `memory.persist` etc.) and
  # litellm forwards `gen_ai.*` generations via its `otel` success
  # callback. None of the langfuse infra carries a `group=` label —
  # langfuse is observability, not part of the system under test, and
  # `cgroup_metrics.py` filters on group ∈ {edge, cloud}; tagging it
  # would inflate the cloud-side resource accounting in every CSV row.
  # Project keys + user are still auto-bootstrapped via LANGFUSE_INIT_*
  # on the postgres first-boot so litellm + the OTLP exporter use the
  # same Basic-auth pair the operator sees in the UI.
  langfuse-db:
    image: postgres:15
    container_name: langfuse-db
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=langfuse
      - POSTGRES_DB=langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    networks:
      - dmas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No `group=` label — langfuse infra is observability, not part of
    # the system under test. Bench cgroup metrics filter on group ∈
    # {edge, cloud}; tagging langfuse would inflate cloud totals.

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: langfuse-clickhouse
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=clickhouse
      - CLICKHOUSE_PASSWORD=clickhouse
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - dmas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-redis:
    image: redis:7-alpine
    container_name: langfuse-redis
    command: ["redis-server", "--requirepass", "redis", "--maxmemory-policy", "noeviction"]
    networks:
      - dmas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  langfuse-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: langfuse-minio
    entrypoint: ["sh", "-c"]
    # `mc mb --ignore-existing` makes the bucket idempotent on every boot.
    command:
      - |
        mkdir -p /data/langfuse
        minio server /data --address ':9000' --console-address ':9001'
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=miniosecret
    volumes:
      - langfuse-minio-data:/data
    networks:
      - dmas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30

  langfuse-worker:
    image: langfuse/langfuse-worker:3.172.1
    container_name: langfuse-worker
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      - SALT=${LANGFUSE_SALT:?set LANGFUSE_SALT in .env}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY in .env (64 hex chars)}
      - TELEMETRY_ENABLED=false
      - CLICKHOUSE_URL=http://langfuse-clickhouse:8123
      - CLICKHOUSE_MIGRATION_URL=clickhouse://langfuse-clickhouse:9000
      - CLICKHOUSE_USER=clickhouse
      - CLICKHOUSE_PASSWORD=clickhouse
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - REDIS_HOST=langfuse-redis
      - REDIS_PORT=6379
      - REDIS_AUTH=redis
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=auto
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=minio
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=miniosecret
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://langfuse-minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_EVENT_UPLOAD_PREFIX=events/
      - LANGFUSE_S3_MEDIA_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_MEDIA_UPLOAD_REGION=auto
      - LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID=minio
      - LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY=miniosecret
      - LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT=http://langfuse-minio:9000
      - LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_MEDIA_UPLOAD_PREFIX=media/
    networks:
      - dmas-network
    restart: unless-stopped

  langfuse-web:
    image: langfuse/langfuse:3.172.1
    container_name: langfuse-web
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-worker:
        condition: service_started
    ports:
      # Bound to all interfaces so it's reachable on the EC2 public IP.
      # The EC2 security group still has to allow inbound 3000.
      # `LANGFUSE_PUBLIC_URL` overrides the host portion when set; keep it
      # in sync with what the operator types in the browser, otherwise
      # NextAuth cookies won't bind to the right origin and login fails.
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      - NEXTAUTH_URL=${LANGFUSE_PUBLIC_URL:-http://localhost:3000}
      # Auto-generated by `make _bootstrap_env_file` — do not commit real
      # values. Override per-deployment via .env if needed.
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:?set LANGFUSE_NEXTAUTH_SECRET in .env}
      - SALT=${LANGFUSE_SALT:?set LANGFUSE_SALT in .env}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY in .env (64 hex chars)}
      - TELEMETRY_ENABLED=false
      - CLICKHOUSE_URL=http://langfuse-clickhouse:8123
      - CLICKHOUSE_MIGRATION_URL=clickhouse://langfuse-clickhouse:9000
      - CLICKHOUSE_USER=clickhouse
      - CLICKHOUSE_PASSWORD=clickhouse
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - REDIS_HOST=langfuse-redis
      - REDIS_PORT=6379
      - REDIS_AUTH=redis
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=auto
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=minio
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=miniosecret
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://langfuse-minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_EVENT_UPLOAD_PREFIX=events/
      - LANGFUSE_S3_MEDIA_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_MEDIA_UPLOAD_REGION=auto
      - LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID=minio
      - LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY=miniosecret
      - LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT=http://langfuse-minio:9000
      - LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_MEDIA_UPLOAD_PREFIX=media/
      # First-boot bootstrap: only fires when the postgres data dir is empty.
      # After that, manage user/projects/keys through the UI.
      - LANGFUSE_INIT_ORG_ID=dmas
      - LANGFUSE_INIT_ORG_NAME=dmas
      - LANGFUSE_INIT_PROJECT_ID=dmas
      - LANGFUSE_INIT_PROJECT_NAME=dmas
      # Headless bootstrap: project keys come from .env (auto-generated
      # by `_bootstrap_env_file` with the pk-lf-/sk-lf- prefixes langfuse
      # validates). No UI dance — `make setup` is non-interactive.
      - LANGFUSE_INIT_PROJECT_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_INIT_PROJECT_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_INIT_USER_EMAIL=dev@local.dev
      - LANGFUSE_INIT_USER_NAME=dev
      - LANGFUSE_INIT_USER_PASSWORD=devdevdev
    networks:
      - dmas-network
    restart: unless-stopped

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    container_name: toxiproxy
    networks:
      - dmas-network
    ports:
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:8005:18005" # listen to Memory
      - "127.0.0.1:8006:18006" # listen to Responder
    command: ["-host=0.0.0.0"]
    restart: unless-stopped
    # Unlabelled: pass-through relay; counting its tx would double the
    # bytes its upstream container already sent.

  benchmark:
    build:
      context: .
      dockerfile: benchmark/Dockerfile
    container_name: benchmark
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      - DATA_URL=https://raw.githubusercontent.com/snap-research/locomo/refs/heads/main/data/locomo10.json
      - LITELLM_METRICS_URL=http://litellm:4000/metrics
      - DOCKER_SOCKET=/var/run/docker.sock
      - CGROUP_ROOT=/host-cgroup
      - PROC_ROOT=/host-proc
      - TOXIPROXY_ADMINS=http://toxiproxy:8474
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_KEY_BACKUP=${OPENAI_API_KEY_BACKUP:-${OPENAI_API_KEY}}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - RESULTS_DIR=/results
      - CONSTRAINED_LATENCY_MS=150
      - CONSTRAINED_JITTER_MS=30
      - CONSTRAINED_BANDWIDTH_KBPS=512
      - LANGFUSE_HOST=http://langfuse-web:3000
      - LANGFUSE_PUBLIC_URL=${LANGFUSE_PUBLIC_URL:-http://localhost:3000}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_PROJECT_ID=${LANGFUSE_PROJECT_ID:-dmas}
    volumes:
      - ../experiments/results:/results
      - /sys/fs/cgroup:/host-cgroup:ro
      - /proc:/host-proc:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dmas-network
    restart: unless-stopped
    # Unlabelled: this is the measurement harness; including it would
    # fold the snapshotting loop's own cost into every row.
  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - memory-internal
    restart: unless-stopped
    # no group= label: qdrant is internal storage, not a measured service boundary.
    # Its TX bytes are intra-AZ traffic (memory-internal bridge) — zero egress cost.
  neo4j:
    image: neo4j:5.26
    container_name: neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      # Force a checkpoint after every committed transaction (default
      # 100k) so the async checkpointer flushes the page cache into the
      # bench's per-call snapshot window. The bench then waits for disk
      # I/O to quiesce before reading t1, so disk_cloud_bytes attributes
      # graphiti's writes to the row that caused them.
      - NEO4J_db_checkpoint_interval_tx=1
      - NEO4J_db_checkpoint_interval_time=1s
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - memory-internal
    restart: unless-stopped
    # no group= label: neo4j is internal storage, not a measured service boundary.
    # Its TX bytes are intra-AZ traffic (memory-internal bridge) — zero egress cost.
  memory:
    build:
      context: .
      dockerfile: memory/Dockerfile
    container_name: memory
    # Port exposed only via toxiproxy (host 8005 -> toxiproxy 18005 -> memory 8002)
    depends_on:
      - qdrant
      - neo4j
    environment:
      - OPENAI_API_KEY=${LITELLM_OPENAI_API_KEY:-sk-litellm-master}
      - OPENAI_BASE_URL=${LITELLM_OPENAI_BASE_URL:-http://litellm:4000/v1}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - GRAPHITI_TELEMETRY_ENABLED=${GRAPHITI_TELEMETRY_ENABLED:-false}
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - MEMORIES_SEARCH_LIMIT=${MEMORIES_SEARCH_LIMIT:-20}
      - RAG_EMBED_MODEL=${RAG_EMBED_MODEL:-text-embedding-3-small}
      - RAG_EMBED_DIM=${RAG_EMBED_DIM:-1536}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - LANGFUSE_HOST=http://langfuse-web:3000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
    ulimits:
      # Cognee 0.5.x stages each `add` to disk and opens a new
      # SQLAlchemy/aiosqlite session per `cognify`. With our per-message
      # ingestion contract that's ~12k add+cognify cycles per full sweep,
      # which can climb past Docker's default 1024 soft FD limit. 65536
      # gives two orders of magnitude headroom for the memory service —
      # mem0/graphiti/rag don't need it but share the container.
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - memory-internal
      - dmas-network
    restart: unless-stopped
    labels:
      - "group=cloud"
  responder:
    build:
      context: .
      dockerfile: responder/Dockerfile
    container_name: responder
    # Port exposed only via toxiproxy (host 8006 -> toxiproxy 18006 -> responder 8003)
    environment:
      - OPENAI_API_KEY=${LITELLM_OPENAI_API_KEY:-sk-litellm-master}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - OPENAI_BASE_URL=${LITELLM_OPENAI_BASE_URL:-http://litellm:4000/v1}
      - MEMORY_URL=${MEMORY_URL:-http://toxiproxy:18005}
      - LANGFUSE_HOST=http://langfuse-web:3000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
    networks:
      - dmas-network
    restart: unless-stopped
    labels:
      - "group=cloud"
  ollama:
    image: ollama/ollama:0.23.2
    container_name: ollama
    ports:
      - "127.0.0.1:11435:11434" # Changed to 11435 to avoid conflict with host ollama
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        ollama serve &
        OLLAMA_PID=$$!

        echo "Waiting for Ollama server to start..."
        sleep 10
        until ollama list > /dev/null 2>&1; do
          echo "Still waiting for Ollama..."
          sleep 2
        done

        echo "Ollama server is ready, pulling model..."
        ollama pull ${OLLAMA_MODEL}

        echo "Model pulled successfully"
        wait $$OLLAMA_PID
    networks:
      - dmas-network
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL}
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q '${OLLAMA_MODEL}'"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 180s
    restart: unless-stopped
    labels:
      - "group=edge"
  coordinator:
    build:
      context: .
      dockerfile: coordinator/Dockerfile
    container_name: coordinator
    ports:
      - "127.0.0.1:8003:8001"
    depends_on:
      benchmark:
        condition: service_started
      memory:
        condition: service_started
      responder:
        condition: service_started
      ollama:
        condition: service_healthy
      toxiproxy:
        condition: service_started
    environment:
      - MEMORY_URL=${MEMORY_URL:-http://toxiproxy:18005}
      - RESPONDER_URL=${RESPONDER_URL:-http://toxiproxy:18006}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://litellm:4000/v1}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - OPENAI_API_KEY=${LITELLM_OPENAI_API_KEY:-sk-litellm-master}
      - LANGFUSE_HOST=http://langfuse-web:3000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
    networks:
      - dmas-network
    restart: unless-stopped
    labels:
      - "group=edge"
volumes:
  qdrant-data:
    labels:
      group: cloud
  neo4j-data:
    labels:
      group: cloud
  neo4j-logs:
    labels:
      group: cloud
  ollama_data:
    labels:
      group: edge
  # Langfuse infra volumes are intentionally unlabelled — see langfuse
  # service block above.
  langfuse-db-data: {}
  langfuse-clickhouse-data: {}
  langfuse-clickhouse-logs: {}
  langfuse-minio-data: {}
networks:
  dmas-network:
    external: true
  memory-internal:
    driver: bridge
