name: dmas-long-context-memory
services:
  # === LLM gateways ====================================================
  # Two litellm instances split by deployment regime. Each is reachable
  # only from its own data-plane subnet, so an edge-side caller cannot
  # cross the boundary by addressing `litellm-cloud:4000` and vice versa.
  # mgmt-net membership is purely for OTLP export to langfuse-web —
  # observability never traverses edge-net / cloud-net.
  litellm-edge:
    image: ghcr.io/berriai/litellm:v1.83.14-stable.patch.3
    container_name: litellm-edge
    # Edge-side proxy: only the ollama route. No host port — coordinator
    # reaches it via the edge-net DNS name.
    volumes:
      - ./litellm/config-edge.yaml:/app/config.yaml.tpl:ro
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_KEY_BACKUP=${OPENAI_API_KEY_BACKUP:-${OPENAI_API_KEY}}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - LANGFUSE_HOST=http://langfuse-web:3000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://langfuse-web:3000/api/public/otel
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=litellm-edge
      - TRACELOOP_TRACE_CONTENT=true
      - OTEL_EXPORTER_OTLP_HEADERS=Authorization=Basic ${LANGFUSE_OTEL_BASIC_AUTH:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        : "$${OLLAMA_MODEL:?OLLAMA_MODEL must be set}"
        sed "s|@OLLAMA_MODEL@|$$OLLAMA_MODEL|g" /app/config.yaml.tpl > /tmp/config.yaml
        exec litellm --config /tmp/config.yaml --port 4000 --host 0.0.0.0
    networks:
      - edge-net
      - mgmt-net
    restart: unless-stopped
    labels:
      - "group=edge"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  litellm-cloud:
    image: ghcr.io/berriai/litellm:v1.83.14-stable.patch.3
    container_name: litellm-cloud
    ports:
      # Operator-facing host port stays bound for ad-hoc /metrics curls;
      # both litellms emit on :4000 inside their respective subnets, only
      # the cloud one is exposed.
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm/config-cloud.yaml:/app/config.yaml.tpl:ro
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_KEY_BACKUP=${OPENAI_API_KEY_BACKUP:-${OPENAI_API_KEY}}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - LANGFUSE_HOST=http://langfuse-web:3000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://langfuse-web:3000/api/public/otel
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=litellm-cloud
      - TRACELOOP_TRACE_CONTENT=true
      - OTEL_EXPORTER_OTLP_HEADERS=Authorization=Basic ${LANGFUSE_OTEL_BASIC_AUTH:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        : "$${OLLAMA_MODEL:?OLLAMA_MODEL must be set}"
        sed "s|@OLLAMA_MODEL@|$$OLLAMA_MODEL|g" /app/config.yaml.tpl > /tmp/config.yaml
        exec litellm --config /tmp/config.yaml --port 4000 --host 0.0.0.0
    networks:
      - cloud-net
      - mgmt-net
    restart: unless-stopped
    labels:
      - "group=cloud"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # === observability / control plane ====================================
  # Langfuse v3 stack + its dependencies live solely on mgmt-net. They
  # are the system's observability backbone; counting their bytes would
  # mix telemetry into the measured data plane.
  langfuse-db:
    image: postgres:15
    container_name: langfuse-db
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=langfuse
      - POSTGRES_DB=langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    networks:
      - mgmt-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 3s
      retries: 20

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: langfuse-clickhouse
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=clickhouse
      - CLICKHOUSE_PASSWORD=clickhouse
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - mgmt-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-redis:
    image: redis:7-alpine
    container_name: langfuse-redis
    command: ["redis-server", "--requirepass", "redis", "--maxmemory-policy", "noeviction"]
    networks:
      - mgmt-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  langfuse-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: langfuse-minio
    entrypoint: ["sh", "-c"]
    command:
      - |
        mkdir -p /data/langfuse
        minio server /data --address ':9000' --console-address ':9001'
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=miniosecret
    volumes:
      - langfuse-minio-data:/data
    networks:
      - mgmt-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30

  langfuse-worker:
    image: langfuse/langfuse-worker:3.172.1
    container_name: langfuse-worker
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      - SALT=${LANGFUSE_SALT:?set LANGFUSE_SALT in .env}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY in .env (64 hex chars)}
      - TELEMETRY_ENABLED=false
      - CLICKHOUSE_URL=http://langfuse-clickhouse:8123
      - CLICKHOUSE_MIGRATION_URL=clickhouse://langfuse-clickhouse:9000
      - CLICKHOUSE_USER=clickhouse
      - CLICKHOUSE_PASSWORD=clickhouse
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - REDIS_HOST=langfuse-redis
      - REDIS_PORT=6379
      - REDIS_AUTH=redis
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=auto
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=minio
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=miniosecret
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://langfuse-minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_EVENT_UPLOAD_PREFIX=events/
      - LANGFUSE_S3_MEDIA_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_MEDIA_UPLOAD_REGION=auto
      - LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID=minio
      - LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY=miniosecret
      - LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT=http://langfuse-minio:9000
      - LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_MEDIA_UPLOAD_PREFIX=media/
    networks:
      - mgmt-net
    restart: unless-stopped

  langfuse-web:
    image: langfuse/langfuse:3.172.1
    container_name: langfuse-web
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-worker:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      - NEXTAUTH_URL=${LANGFUSE_PUBLIC_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:?set LANGFUSE_NEXTAUTH_SECRET in .env}
      - SALT=${LANGFUSE_SALT:?set LANGFUSE_SALT in .env}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY in .env (64 hex chars)}
      - TELEMETRY_ENABLED=false
      - CLICKHOUSE_URL=http://langfuse-clickhouse:8123
      - CLICKHOUSE_MIGRATION_URL=clickhouse://langfuse-clickhouse:9000
      - CLICKHOUSE_USER=clickhouse
      - CLICKHOUSE_PASSWORD=clickhouse
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - REDIS_HOST=langfuse-redis
      - REDIS_PORT=6379
      - REDIS_AUTH=redis
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=auto
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=minio
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=miniosecret
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://langfuse-minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_EVENT_UPLOAD_PREFIX=events/
      - LANGFUSE_S3_MEDIA_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_MEDIA_UPLOAD_REGION=auto
      - LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID=minio
      - LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY=miniosecret
      - LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT=http://langfuse-minio:9000
      - LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_MEDIA_UPLOAD_PREFIX=media/
      - LANGFUSE_INIT_ORG_ID=dmas
      - LANGFUSE_INIT_ORG_NAME=dmas
      - LANGFUSE_INIT_PROJECT_ID=dmas
      - LANGFUSE_INIT_PROJECT_NAME=dmas
      - LANGFUSE_INIT_PROJECT_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_INIT_PROJECT_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_INIT_USER_EMAIL=dev@local.dev
      - LANGFUSE_INIT_USER_NAME=dev
      - LANGFUSE_INIT_USER_PASSWORD=devdevdev
    networks:
      - mgmt-net
    restart: unless-stopped

  # === edge↔cloud gateway ===============================================
  # Only container with feet in BOTH data-plane subnets. Static IPs are
  # required so the bench can deterministically resolve which container
  # interface faces edge-net (the rx/tx counters on that interface are
  # the single boundary measurement). Also on mgmt-net so the bench can
  # reach the :8474 admin API without crossing the data plane.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    container_name: toxiproxy
    ports:
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:8005:18005" # listen to Memory
      - "127.0.0.1:8006:18006" # listen to Responder
    command: ["-host=0.0.0.0"]
    networks:
      edge-net:
        ipv4_address: ${EDGE_NET_TOXIPROXY_IP:-172.30.1.10}
      cloud-net:
        ipv4_address: ${CLOUD_NET_TOXIPROXY_IP:-172.30.2.10}
      mgmt-net: {}
    restart: unless-stopped

  # === bench / orchestrator =============================================
  # Lives on mgmt-net only. Calls coordinator (via mgmt-net), toxiproxy
  # admin (via mgmt-net), and both litellm /metrics endpoints (via
  # mgmt-net). The data plane is never touched by the bench itself.
  benchmark:
    build:
      context: .
      dockerfile: benchmark/Dockerfile
    container_name: benchmark
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      - DATA_URL=https://raw.githubusercontent.com/snap-research/locomo/refs/heads/main/data/locomo10.json
      # Two litellm endpoints to aggregate /metrics from. Edge serves
      # ollama, cloud serves OpenAI passthrough; classification by model
      # name in shared/litellm_usage.py groups them correctly across both.
      - LITELLM_METRICS_URLS=http://litellm-edge:4000/metrics,http://litellm-cloud:4000/metrics
      - DOCKER_SOCKET=/var/run/docker.sock
      - CGROUP_ROOT=/host-cgroup
      - PROC_ROOT=/host-proc
      - TOXIPROXY_ADMINS=http://toxiproxy:8474
      # Gateway-veth metering: the bench finds toxiproxy's interface
      # routing to EDGE_NET_CIDR inside its netns, then reads rx/tx
      # bytes on that interface for the single edge↔cloud counter.
      - GATEWAY_CONTAINER=toxiproxy
      - EDGE_NET_CIDR=${EDGE_NET_SUBNET:-172.30.1.0/24}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_KEY_BACKUP=${OPENAI_API_KEY_BACKUP:-${OPENAI_API_KEY}}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - RESULTS_DIR=/results
      - CONSTRAINED_LATENCY_MS=150
      - CONSTRAINED_JITTER_MS=30
      - CONSTRAINED_BANDWIDTH_KBPS=512
      - LANGFUSE_HOST=http://langfuse-web:3000
      - LANGFUSE_PUBLIC_URL=${LANGFUSE_PUBLIC_URL:-http://localhost:3000}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_PROJECT_ID=${LANGFUSE_PROJECT_ID:-dmas}
    volumes:
      - ../experiments/results:/results
      - /sys/fs/cgroup:/host-cgroup:ro
      - /proc:/host-proc:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - mgmt-net
    restart: unless-stopped

  # === cloud subnet =====================================================
  # qdrant + neo4j are pure storage. They never need to leave cloud-net
  # — `memory` reaches them by service name. Storage<->memory chatter is
  # intra-cloud and excluded from the boundary counter by construction.
  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - cloud-net
    restart: unless-stopped
    labels:
      - "group=cloud"

  neo4j:
    image: neo4j:5.26
    container_name: neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_db_checkpoint_interval_tx=1
      - NEO4J_db_checkpoint_interval_time=1s
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - cloud-net
    restart: unless-stopped
    labels:
      - "group=cloud"

  memory:
    build:
      context: .
      dockerfile: memory/Dockerfile
    container_name: memory
    depends_on:
      - qdrant
      - neo4j
    environment:
      - OPENAI_API_KEY=${LITELLM_OPENAI_API_KEY:-sk-litellm-master}
      - OPENAI_BASE_URL=${LITELLM_OPENAI_BASE_URL:-http://litellm-cloud:4000/v1}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - GRAPHITI_TELEMETRY_ENABLED=${GRAPHITI_TELEMETRY_ENABLED:-false}
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - MEMORIES_SEARCH_LIMIT=${MEMORIES_SEARCH_LIMIT:-20}
      - RAG_EMBED_MODEL=${RAG_EMBED_MODEL:-text-embedding-3-small}
      - RAG_EMBED_DIM=${RAG_EMBED_DIM:-1536}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - LANGFUSE_HOST=http://langfuse-web:3000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - cloud-net
      - mgmt-net
    restart: unless-stopped
    labels:
      - "group=cloud"

  responder:
    build:
      context: .
      dockerfile: responder/Dockerfile
    container_name: responder
    environment:
      - OPENAI_API_KEY=${LITELLM_OPENAI_API_KEY:-sk-litellm-master}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - OPENAI_BASE_URL=${LITELLM_OPENAI_BASE_URL:-http://litellm-cloud:4000/v1}
      # Responder talks to memory DIRECTLY on cloud-net. Going through
      # toxiproxy here would (a) double-count responder↔memory bytes
      # against the edge↔cloud boundary and (b) apply the constrained
      # toxics to intra-cloud traffic. Coordinator's `/memorize` path is
      # the only flow that should hit toxiproxy:18005.
      - MEMORY_URL=${MEMORY_URL:-http://memory:8002}
      - LANGFUSE_HOST=http://langfuse-web:3000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
    networks:
      - cloud-net
      - mgmt-net
    restart: unless-stopped
    labels:
      - "group=cloud"

  # === edge subnet ======================================================
  ollama:
    image: ollama/ollama:0.23.2
    container_name: ollama
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        ollama serve &
        OLLAMA_PID=$$!

        echo "Waiting for Ollama server to start..."
        sleep 10
        until ollama list > /dev/null 2>&1; do
          echo "Still waiting for Ollama..."
          sleep 2
        done

        echo "Ollama server is ready, pulling model..."
        ollama pull ${OLLAMA_MODEL}

        echo "Model pulled successfully"
        wait $$OLLAMA_PID
    networks:
      - edge-net
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL}
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q '${OLLAMA_MODEL}'"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 180s
    restart: unless-stopped
    labels:
      - "group=edge"

  coordinator:
    build:
      context: .
      dockerfile: coordinator/Dockerfile
    container_name: coordinator
    ports:
      - "127.0.0.1:8003:8001"
    depends_on:
      benchmark:
        condition: service_started
      memory:
        condition: service_started
      responder:
        condition: service_started
      ollama:
        condition: service_healthy
      toxiproxy:
        condition: service_started
    environment:
      # Coordinator is the SOLE caller that reaches memory + responder
      # through toxiproxy — those calls are the edge↔cloud boundary.
      # Use toxiproxy's pinned edge-net IP (not the name) because Docker
      # DNS for a multi-homed container returns all attached IPs and the
      # resolver may pick the mgmt-net one, which would bypass both the
      # constrained toxics and the boundary counter.
      - MEMORY_URL=http://${EDGE_NET_TOXIPROXY_IP:-172.30.1.10}:18005
      - RESPONDER_URL=http://${EDGE_NET_TOXIPROXY_IP:-172.30.1.10}:18006
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://litellm-edge:4000/v1}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - OPENAI_API_KEY=${LITELLM_OPENAI_API_KEY:-sk-litellm-master}
      - LANGFUSE_HOST=http://langfuse-web:3000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
    networks:
      - edge-net
      - mgmt-net
    restart: unless-stopped
    labels:
      - "group=edge"

volumes:
  qdrant-data:
    labels:
      group: cloud
  neo4j-data:
    labels:
      group: cloud
  neo4j-logs:
    labels:
      group: cloud
  ollama_data:
    labels:
      group: edge
  langfuse-db-data: {}
  langfuse-clickhouse-data: {}
  langfuse-clickhouse-logs: {}
  langfuse-minio-data: {}

networks:
  # Three compose-managed bridges. Subnets are interpolated from .env
  # (auto-picked by `_bootstrap_env_file` if missing) so the bench can
  # resolve toxiproxy's edge-facing interface by route inspection and
  # static IPs stay stable across `docker compose down/up`.
  edge-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${EDGE_NET_SUBNET:-172.30.1.0/24}
  cloud-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${CLOUD_NET_SUBNET:-172.30.2.0/24}
  mgmt-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${MGMT_NET_SUBNET:-172.30.3.0/24}
